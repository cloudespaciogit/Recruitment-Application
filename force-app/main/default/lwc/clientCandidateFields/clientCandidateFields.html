<template>
    <lightning-card>
        <!-- Header -->
        <div class="header">
            <h1 class="title">Configure Candidate Fields for Client Email</h1>
            <p class="subtitle">
                Review and manage which <strong>Candidate</strong> fields appear in emails.
            </p>
        </div>

        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="slds-is-relative slds-p-around_large">
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Main Content -->
        <template if:false={isLoading}>
            <div class="slds-p-around_medium" style="padding: 1rem 0rem;">

                <!-- STEP 1: Review & Reorder Selection -->
                <section class="step-card">
                    <div class="step-header">
                        <h2>Selected Candidate Fields</h2>
                    </div>

                    <template if:true={selectedLabels.length}>
                        <div class="tag-container">
                            <template for:each={selectedLabels} for:item="label" for:index="index">
                                <span
                                    key={label}
                                    class="field-tag"
                                    draggable="true"
                                    data-index={index}
                                    ondragstart={handleDragStart}
                                    ondragover={handleDragOver}
                                    ondrop={handleDrop}>
                                    {label}
                                </span>
                            </template>
                        </div>
                        <p class="hint">Drag & drop fields to reorder their priority in emails.</p>
                    </template>

                    <template if:false={selectedLabels.length}>
                        <p class="hint">No fields selected yet. Click "Add Fields" to choose.</p>
                    </template>

                    <!-- Add Fields Button -->
                    <div class="slds-m-top_small">
                        <lightning-button variant="brand" label="Click Here To Add Fields" onclick={openModal}></lightning-button>
                    </div>
                </section>

                <!-- STEP 2: Save -->
                <div style="width:100%; display: flex; justify-content: flex-end;">
                    <lightning-button variant="brand" label="Save Configuration" onclick={handleSave} disabled={isSaving} >
                    </lightning-button>
                </div>

            </div>
        </template>

        <!-- MODAL: Field Selection -->
        <template if:true={showModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <!-- Modal Header -->
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Select Candidate Fields</h2>
                    </header>

                    <!-- Modal Body -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input
                            type="search"
                            label="Search Available Fields"
                            value={searchTerm}
                            onchange={handleSearchChange}
                            class="slds-m-bottom_small">
                        </lightning-input>

                        <lightning-dual-listbox
                            name="fields"
                            label="Available Candidate Fields"
                            source-label="Available Fields"
                            selected-label="Selected Fields"
                            options={filteredOptions}
                            value={selectedValues}
                            onchange={handleChange}
                            class="custom-dualbox"
                            required>
                        </lightning-dual-listbox>
                    </div>

                    <!-- Modal Footer -->
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>
                        <lightning-button variant="brand" label="Save Selection" onclick={saveModalSelection}></lightning-button>
                    </footer>
                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
