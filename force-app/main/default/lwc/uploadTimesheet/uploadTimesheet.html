<template>
    <lightning-card>

        <!-- BUTTON -->
        <lightning-button
            label="Upload Timesheet"
            variant="brand"
            onclick={openModal}>
        </lightning-button>

        <!-- MODAL -->
        <template if:true={isModalOpen}>
            <section class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">

                    <!-- HEADER -->
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">
                            <template if:true={isStepOne}>Select Project</template>
                            <template if:true={isStepTwo}>Upload Timesheet</template>
                        </h2>
                    </header>

                    <!-- BODY -->
                    <div class="slds-modal__content slds-p-around_medium">

                        <!-- STEP 1 -->
                        <template if:true={isStepOne}>
                            <lightning-combobox
                                label="Project"
                                placeholder="Select Project"
                                options={projectOptions}
                                value={selectedProject}
                                onchange={handleProjectChange}>
                            </lightning-combobox>
                        </template>

                        <!-- STEP 2 -->
                        <template if:true={isStepTwo}>

                            <lightning-input
                                type="file"
                                label="Upload Timesheet"
                                accept=".csv"
                                onchange={handleFilesChange}>
                            </lightning-input>

                            <!-- ✅ VISIBLE HELP TEXT -->
                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                Only CSV files are accepted
                            </p>

                            <!-- Selected file name -->
                            <template if:true={selectedFileName}>
                                <p class="slds-text-body_small slds-m-top_x-small">
                                    Selected file:
                                    <strong>{selectedFileName}</strong>
                                </p>
                            </template>

                        </template>

                    </div>

                    <!-- FOOTER -->
                    <footer class="slds-modal__footer">

                        <!-- STEP 1 -->
                        <template if:true={isStepOne}>
                            <lightning-button
                                variant="neutral"
                                label="Cancel"
                                onclick={closeModal}>
                            </lightning-button>

                            <lightning-button
                                variant="brand"
                                label="Next"
                                class="slds-m-left_small"
                                onclick={handleNext}>
                            </lightning-button>
                        </template>

                        <!-- STEP 2 -->
                        <template if:true={isStepTwo}>
                            <lightning-button
                                variant="neutral"
                                label="Cancel"
                                onclick={closeModal}>
                            </lightning-button>

                            <lightning-button
                                variant="brand"
                                label="Upload"
                                class="slds-m-left_small"
                                onclick={handleUpload}>
                            </lightning-button>
                        </template>

                    </footer>

                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>
</template>
