<template>
    <lightning-card>

        <!-- 🔹 EMPTY STATE -->
        <template if:false={hasData}>
            <div class="empty-state">
                No matched candidates found
            </div>
        </template>

        <!-- 🔹 TOP BULK BAR -->
        <template if:true={hasData}>
            <div class="bulk-bar slds-grid slds-grid_align-end">
                <lightning-button
                    label={bulkButtonLabel}
                    variant="brand"
                    onclick={handleBulkAdd}
                    disabled={isBulkDisabled}>
                </lightning-button>
            </div>
        </template>

        <!-- 🔹 TABLE -->
        <template if:true={hasData}>
            <div class="table-wrapper">

                <!-- HEADER -->
                <div class="table-header slds-grid">
                    <div class="col checkbox-col">
                        <lightning-input
                            type="checkbox"
                            checked={isAllSelected}
                            onchange={handleSelectAll}>
                        </lightning-input>
                    </div>

                    <div class="col name">Candidate Name</div>
                    <div class="col match">Match %</div>
                    <div class="col rating">Rating</div>
                    <div class="col skills">Primary Skills</div>
                    <div class="col exp">Relevant Exp</div>
                    <div class="col notice">Notice Period</div>
                    <div class="col updated">Last Updated</div>
                    <div class="col action">Action</div>
                </div>

                <!-- ROWS -->
                <template for:each={pagedData} for:item="row">
                    <div key={row.candidateId} class="table-row slds-grid">

                        <div class="col checkbox-col">
                            <lightning-input
                                type="checkbox"
                                checked={row.isSelected}
                                data-id={row.candidateId}
                                onchange={handleCheckboxChange}>
                            </lightning-input>
                        </div>

                        <div class="col name">{row.candidateName}</div>
                        <div class="col match">{row.matchPercentage}%</div>
                        <div class="col rating">{row.candidateRating}</div>
                        <div class="col skills">{row.primarySkills}</div>
                        <div class="col exp">{row.relevantExperience}</div>
                        <div class="col notice">{row.noticePeriod}</div>
                        <div class="col updated">{row.lastProfileUpdate}</div>

                        <div class="col action">
                            <lightning-button
                                label="Add"
                                size="small"
                                variant="brand"
                                disabled={row.isSelected}
                                data-id={row.candidateId}
                                onclick={handleSingleAdd}>
                            </lightning-button>
                        </div>

                    </div>
                </template>
            </div>
        </template>

        <!-- 🔹 PAGINATION FOOTER -->
        <template if:true={hasData}>
            <template if:true={totalPages}>
                <div class="pagination-footer">

                    <!-- ROW 1 : Records per page (RIGHT) -->
                    <div class="pagination-top">
                        <div class="pagination-right">
                            <span class="records-label">Records per page:</span>
                            <lightning-combobox
                                value={pageSize}
                                options={pageSizeOptions}
                                variant="label-hidden"
                                onchange={handlePageSizeChange}>
                            </lightning-combobox>
                        </div>
                    </div>

                    <!-- ROW 2 : Pagination (CENTER, LOWER) -->
                    <div class="pagination-bottom">
                        <lightning-button
                            label="Previous"
                            onclick={handlePrev}
                            disabled={isFirstPage}
                            icon-name="utility:chevronleft"
                            icon-position="left">
                        </lightning-button>

                        <span class="page-info">
                            Page {currentPage} of {totalPages}
                        </span>

                        <lightning-button
                            label="Next"
                            onclick={handleNext}
                            disabled={isLastPage}
                            icon-name="utility:chevronright"
                            icon-position="right">
                        </lightning-button>
                    </div>

                </div>
            </template>
        </template>

    </lightning-card>
</template>
