<template>
    <lightning-card>

        <!-- Message -->
        <template if:true={hasRecords}>
        <p class="slds-text-align_center slds-text-color_success slds-text-heading_small slds-p-vertical_small slds-text-title_bold">
            File has been exported successfully.
        </p>
        </template>
        <template if:false={hasRecords}>
        <p class="slds-text-align_center slds-text-color_error slds-text-heading_small slds-p-vertical_small slds-text-title_bold">
                At least one record should be selected.
            </p>
            <div class="slds-p-around_small slds-grid slds-grid_align-end">
            <lightning-button 
                label="Back"
                variant="brand" 
                onclick={handleBack}>
            </lightning-button>
        </div>

        </template>
    </lightning-card>
</template>
