<template>
    <lightning-card title="Supplier Candidates">
        <div class="slds-p-around_small">

            <!-- Search Input -->
            <div class="slds-m-bottom_small">
                <lightning-input
                    name="search"
                    label="Search candidates (Name, Email, Phone, Skills, Experience, Designation, Notice Period)"
                    placeholder="Enter Name, Email, Phone, Skills, Exper....."
                    value={searchKey}
                    onchange={handleSearchInput}
                    onkeyup={handleSearchKeyUp}
                    style="width:100%;">
                </lightning-input>
            </div>

            <!-- Gap -->
            <div style="height:0.6rem;"></div>

            <!-- DATATABLE -->
            <template if:true={candidates}>
                <lightning-datatable
                    key-field="Id"
                    data={candidates}
                    columns={columns}
                    onrowaction={handleRowAction}
                    onrowselection={handleRowSelection}
                    selected-rows={selectedRowIds}
                    max-row-selection="500">
                </lightning-datatable>

                <div class="slds-m-top_small">
                    <lightning-button
                        label="Create Interviews"
                        onclick={handleCreateInterviews}
                        disabled={isCreateDisabled}
                        variant="brand">
                    </lightning-button>
                </div>
            </template>

            <template if:true={error}>
                <p class="slds-text-color_error">{error}</p>
            </template>
        </div>
    </lightning-card>

    <!-- MODAL FOR EDITING -->
    <template if:true={showEditModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Edit Candidate</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-combobox
                        label="Notice Period"
                        value={editingNoticeValue}
                        options={noticePeriodOptions}
                        onchange={handleNoticeChange}>
                    </lightning-combobox>

                    <div class="slds-m-top_small">
                        <lightning-input
                            type="number"
                            label="Supplier Expected Rate"
                            value={editingExpectedRate}
                            onchange={handleExpectedRateChange}
                            formatter="currency"
                            step="0.01">
                        </lightning-input>
                    </div>

                    <p class="slds-text-body_small slds-m-top_small">
                        Candidate: {editingCandidateName}
                    </p>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={closeEditModal}></lightning-button>
                    <lightning-button variant="brand" label="Save" onclick={saveEditChanges} class="slds-m-left_small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
